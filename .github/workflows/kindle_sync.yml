name: Kindle Instagram Photo Sync

on:
  schedule:
    # Runs every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web interface

permissions:
  contents: write # Needed to commit new images and manifest back to repo

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Instagram Sync & E-Ink Image Processor
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          INSTALOADER_SESSION_B64: ${{ secrets.INSTALOADER_SESSION_B64 }}
          INSTAGRAM_LOGIN_USER: ${{ secrets.INSTAGRAM_LOGIN_USER }}
          INSTAGRAM_SESSIONID: ${{ secrets.INSTAGRAM_SESSIONID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python sync.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No new images or changes to commit."
          else
            git commit -m "Auto-sync Instagram photos for Kindle [skip ci]"
            git push
          fi
