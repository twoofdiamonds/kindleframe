<!DOCTYPE html>
<html>
<head>
    <title>Kindle Photo Frame</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; padding: 24px; text-align: center; }
        .card { background: white; padding: 32px; border-radius: 12px; max-width: 600px; margin: 40px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; }
        p { color: #64748b; line-height: 1.5; }

<body>
    <div class="card">
        <h1>🖼️ Kindle Frame Initialized</h1>
        <p>The repository has been set up. Trigger the GitHub Action workflow once or wait for the scheduled 12-hour sync to fetch the first photos!</p>
    </div>

</html>
